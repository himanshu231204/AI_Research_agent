name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository }}/api
  IMAGE_NAME_WORKER: ${{ github.repository }}/worker
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================================
  # PREREQUISITE: Verify CI passed
  # ============================================================
  ci-check:
    name: Verify CI Status
    runs-on: ubuntu-latest
    steps:
      - name: Get CI run status
        id: ci-status
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: context.ref,
              per_page: 1
            });
            
            if (runs.data.workflow_runs.length === 0) {
              // No CI workflow found - skip check (might be first release)
              core.setOutput('status', 'skipped');
              core.info('No CI workflow found, skipping check');
            } else {
              const run = runs.data.workflow_runs[0];
              const status = run.conclusion || run.status;
              core.setOutput('status', status);
              core.info(`CI status: ${status}`);
            }

      - name: CI passed or skipped
        if: "steps.ci-status.outputs.status == 'success' || steps.ci-status.outputs.status == 'skipped'"
        run: "echo 'CI verified: ${{ steps.ci-status.outputs.status }}'"

      - name: Fail if CI not passed
        if: "steps.ci-status.outputs.status != 'success' && steps.ci-status.outputs.status != 'skipped'"
        run: |
          echo "Error: CI workflow has not passed!"
          echo "Status: ${{ steps.ci-status.outputs.status }}"
          echo "Please ensure all tests pass before creating a release."
          exit 1

  # ============================================================
  # PREPARE: Extract version and changelog
  # ============================================================
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    needs: ci-check
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          # Get commits since last release tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            # First release - get all commits
            COMMITS=$(git log --oneline --format='* %s (%h)' -100)
          else
            # Get commits between previous tag and current tag
            COMMITS=$(git log "$PREV_TAG..HEAD" --oneline --format='* %s (%h)')
          fi
          
          # Categorize commits by conventional commit type
          FEATURES=$(echo "$COMMITS" | grep -E "^(feat|feature):" | sed 's/^(feat[^)]*)//' || echo "")
          FIXES=$(echo "$COMMITS" | grep -E "^(fix|bugfix):" | sed 's/^(fix[^)]*)//' || echo "")
          DOCS=$(echo "$COMMITS" | grep -E "^docs:" | sed 's/^(docs[^)]*)//' || echo "")
          CHORES=$(echo "$COMMITS" | grep -E "^(chore|build|ci|refactor|perf|test|style):" | sed 's/^([^)]*)//' || echo "")
          OTHER=$(echo "$COMMITS" | grep -vE "^(feat|feature|fix|bugfix|docs|chore|build|ci|refactor|perf|test|style):" || echo "")
          
          # Build changelog markdown
          cat << 'CHANGELOG_EOF' > $GITHUB_OUTPUT
          changelog<<EOF
          ## What's Changed

          ### Features
          $FEATURES
          $OTHER

          ### Bug Fixes
          $FIXES

          ### Documentation
          $DOCS

          ### Maintenance
          $CHORES

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...v${{ steps.version.outputs.version }}
          EOF
          CHANGELOG_EOF

      - name: Display version
        run: |
          echo "Release version: v${{ steps.version.outputs.version }}"
          echo "Tag: ${{ steps.version.outputs.tag }}"

      - name: Display changelog preview
        run: |
          echo "=== CHANGELOG PREVIEW ==="
          echo "${{ env.changelog }}"
          echo "=========================="

  # ============================================================
  # BUILD: Build and test the application
  # ============================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint code
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: |
          mypy .

      - name: Run tests
        run: |
          pytest -v --cov=. --cov-report=xml --cov-fail-under=70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ============================================================
  # BUILD DOCKER: Build Docker images
  # ============================================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [prepare, build]
    strategy:
      matrix:
        dockerfile:
          - path: deployment/Dockerfile.api
            image: ${{ env.IMAGE_NAME_API }}
          - path: deployment/Dockerfile.worker
            image: ${{ env.IMAGE_NAME_WORKER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.dockerfile.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
            type=sha,prefix=,suffix=,format=sha
            type=raw,value=latest,enable=${{ needs.prepare.outputs.version == github.event.release.tag_name }}

      - name: Build and push API image
        if: matrix.dockerfile.path == 'deployment/Dockerfile.api'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile.path }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        if: matrix.dockerfile.path == 'deployment/Dockerfile.worker'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile.path }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digests
        run: |
          echo "Docker images built and pushed with tags:"
          echo "${{ steps.meta.outputs.tags }}"

  # ============================================================
  # RELEASE: Create GitHub Release
  # ============================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [prepare, build, build-docker]
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: ./artifacts

      - name: Create Release
        id: create_release
        uses: actions/create-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          release_name: Release v${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, 'alpha') || contains(needs.prepare.outputs.version, 'beta') || contains(needs.prepare.outputs.version, 'rc') }}
          body: |
            ## What's New in v${{ needs.prepare.outputs.version }}

            ${{ needs.prepare.outputs.changelog }}

            ## Installation

            ### Docker
            ```bash
            # Pull the latest release
            docker pull ghcr.io/${{ github.repository }}/api:v${{ needs.prepare.outputs.version }}
            docker pull ghcr.io/${{ github.repository }}/worker:v${{ needs.prepare.outputs.version }}

            # Or use the unified tag
            docker pull ghcr.io/${{ github.repository }}/api:latest
            docker pull ghcr.io/${{ github.repository }}/worker:latest
            ```

            ### Docker Compose
            ```yaml
            # Update your docker-compose.yml
            services:
              api:
                image: ghcr.io/${{ github.repository }}/api:v${{ needs.prepare.outputs.version }}
              celery-research:
                image: ghcr.io/${{ github.repository }}/worker:v${{ needs.prepare.outputs.version }}
            ```

            ## Image Manifests

            | Component | Image Tag |
            |-----------|-----------|
            | API | `ghcr.io/${{ github.repository }}/api:v${{ needs.prepare.outputs.version }}` |
            | Worker | `ghcr.io/${{ github.repository }}/worker:v${{ needs.prepare.outputs.version }}` |
            | Latest | `ghcr.io/${{ github.repository }}/api:latest` |

            ---
            *This release was automatically generated by GitHub Actions.*
          commitish: ${{ github.sha }}

      - name: Upload coverage artifact to release
        uses: actions/upload-release-asset@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/coverage.xml
          asset_name: coverage-report-v${{ needs.prepare.outputs.version }}.xml
          asset_content_type: application/xml

  # ============================================================
  # ANNOTATE: Post-release annotations and cleanup
  # ============================================================
  annotate:
    name: Post-Release Annotations
    runs-on: ubuntu-latest
    needs: release
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate deployment manifest
        env:
          VERSION: v${{ needs.release.outputs.version }}
        run: |
          cat << 'EOF' > deployment-manifest.json
          {
            "version": "$VERSION",
            "repository": "${{ github.repository }}",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "images": {
              "api": "ghcr.io/${{ github.repository }}/api:$VERSION",
              "worker": "ghcr.io/${{ github.repository }}/worker:$VERSION"
            },
            "artifacts": [
              "coverage-report-$VERSION.xml"
            ]
          }
          EOF

      - name: Upload deployment manifest
        uses: actions/upload-release-asset@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: ./deployment-manifest.json
          asset_name: deployment-manifest.json
          asset_content_type: application/json

      - name: Create deployment summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ needs.release.outputs.tag_name || 'v' + needs.prepare.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Released by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Images**:" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository }}/api:v${{ needs.prepare.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository }}/worker:v${{ needs.prepare.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL**: ${{ github.server_url }}/${{ github.repository }}/releases/${{ needs.release.outputs.release_id }}" >> $GITHUB_STEP_SUMMARY

      - name: Post release notification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Release workflow completed successfully!"

  # ============================================================
  # BUMP: Update main branch with next version
  # ============================================================
  bump:
    name: Bump Version
    runs-on: ubuntu-latest
    needs: release
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Determine next version
        id: next-version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Parse current version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          # For now, just bump patch
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="$MAJOR.$MINOR.$NEXT_PATCH"
          
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "next_tag=v$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: Update pyproject.toml version
        run: |
          sed -i 's/^version = "[^"]*"/version = "${{ steps.next-version.outputs.next_version }}"/' pyproject.toml
          cat pyproject.toml | grep "^version"

      - name: Create bump commit
        run: |
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.next-version.outputs.next_version }}"
          git push

      - name: Create bump PR
        uses: actions/create-pull-request@v5
        with:
          title: 'chore: bump version to ${{ steps.next-version.outputs.next_version }}'
          body: |
            Bumping version for development after release v${{ needs.prepare.outputs.version }}.
            
            **Changes**:
            - Updated version in `pyproject.toml` to `${{ steps.next-version.outputs.next_version }}`
            
            Please review and merge.
          branch: chore/bump-version-${{ steps.next-version.outputs.next_version }}
          delete-branch: true
          labels: |
            automated
            version-bump