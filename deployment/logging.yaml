# Logging Configuration for Research OS
# This file configures Python logging with rotation

version: 1
disable_existing_loggers: false

formatters:
  # Standard text format
  standard:
    format: '%(asctime)s - %(name)s - %(levelname)s - [%(request_id)s] - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  
  # JSON format for production
  json:
    class: pythonjsonlogger.jsonlogger.JsonFormatter
    format: '%(asctime)s %(name)s %(levelname)s %(message)s %(request_id)s'
  
  # Detailed format for debugging
  detailed:
    format: '%(asctime)s - %(name)s - %(levelname)s - [%(request_id)s] - %(funcName)s:%(lineno)d - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
  # Console output (for development)
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  
  # File handler with rotation (production)
  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: /var/log/research-os/app.log
    maxBytes: 10485760  # 10MB
    backupCount: 10
    encoding: utf8
  
  # Error file handler (separate file for errors)
  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: /var/log/research-os/error.log
    maxBytes: 10485760  # 10MB
    backupCount: 10
    encoding: utf8
  
  # JSON file handler for log aggregation
  json_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: /var/log/research-os/app.json.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

loggers:
  # Application loggers
  api:
    level: INFO
    handlers: [console, file, error_file]
    propagate: false
  
  workers:
    level: INFO
    handlers: [console, file, error_file]
    propagate: false
  
  models:
    level: INFO
    handlers: [console, file, error_file]
    propagate: false
  
  memory:
    level: INFO
    handlers: [console, file, error_file]
    propagate: false
  
  graphs:
    level: INFO
    handlers: [console, file, error_file]
    propagate: false
  
  # Third-party loggers (reduce noise)
  uvicorn:
    level: INFO
    handlers: [console, file]
    propagate: false
  
  celery:
    level: INFO
    handlers: [console, file]
    propagate: false
  
  httpx:
    level: WARNING
    handlers: [console]
    propagate: false
  
  chromadb:
    level: WARNING
    handlers: [console]
    propagate: false

# Root logger
root:
  level: INFO
  handlers: [console, file, error_file]