name: Security Scan

on:
  schedule:
    # Run every Monday at 06:00 UTC (weekly security audit)
    - cron: "0 6 * * 1"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    # Allow manual trigger for on-demand scans

env:
  PYTHON_VERSION: "3.11"
  PIP_AUDIT_IGNORE_LINKS: "true"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Dependency Vulnerability Scan
  # ─────────────────────────────────────────────────────────────────────────────
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pip-audit-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-pip-audit-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit (strict mode)
        run: |
          pip-audit \
            --require-hashes \
            --format=json \
            --output=pip-audit-results.json
        continue-on-error: true

      - name: Check for vulnerabilities
        run: |
          python -c "
          import json
          with open('pip-audit-results.json') as f:
            data = json.load(f)
          vulnerabilities = data.get('vulnerabilities', [])
          if vulnerabilities:
            print(f'ERROR: Found {len(vulnerabilities)} vulnerable dependencies!')
            for vuln in vulnerabilities:
              print(f\"  - {vuln.get('name', 'unknown')} ({vuln.get('version', 'unknown')}): {vuln.get('vulns', [])}\")
            exit(1)
          else:
            print('PASS: No vulnerable dependencies found.')
          "

      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: pip-audit-results.json
          retention-days: 30

      - name: Publish vulnerability results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pip-audit-results.json
          category: pip-audit

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Secret Scanning with detect-secrets
  # ─────────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Run baseline scan (first time only)
        run: |
          detect-secrets scan \
            --force-use-all-plugins \
            --output .secrets.baseline \
            . || true
        continue-on-error: true

      - name: Audit for new secrets
        run: |
          detect-secrets audit .secrets.baseline || true

      - name: Upload secrets baseline
        uses: actions/upload-artifact@v4
        with:
          name: secrets-baseline
          path: .secrets.baseline
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Additional Dependency Check (OWASP)
  # ─────────────────────────────────────────────────────────────────────────────
  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java (required for OWASP Dependency Check)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build project
        run: |
          python -m pip install --upgrade pip
          pip install -e . || pip install -r requirements.txt || true

      - name: Run OWASP Dependency Check
        run: |
          mkdir -p owasp-reports
          dependency-check.sh \
            --project "${{ github.repository }}" \
            --scan "." \
            --format JSON \
            --output owasp-reports \
            --prettyPrint \
            --enableExperimental \
            --failOnCVSS 7 \
          || true
        continue-on-error: true

      - name: Upload OWASP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-reports
          path: owasp-reports
          retention-days: 30

      - name: Publish OWASP SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: owasp-reports
          category: owasp-dependency-check

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: High-level Security Summary (GitHub Security Alerts)
  # ─────────────────────────────────────────────────────────────────────────────
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, secret-scan, owasp-dependency-check]
    if: always()
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate summary report
        run: |
          echo "## 🔒 Security Scan Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Dependency scan results
          if [ -f artifacts/pip-audit-results/pip-audit-results.json ]; then
            echo "### 📦 Dependency Vulnerabilities" >> $GITHUB_STEP_SUMMARY
            python -c "
            import json
            with open('artifacts/pip-audit-results/pip-audit-results.json') as f:
              data = json.load(f)
            vulns = data.get('vulnerabilities', [])
            if vulns:
              for v in vulns:
                echo(f\"- **{v.get('name', '?')}@{v.get('version', '?')}**: {', '.join(v.get('vulns', [])[:3])}\")
            else:
              echo('✅ No vulnerable dependencies found')
            " >> $GITHUB_STEP_SUMMARY
          fi

          # Secrets baseline check
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔑 Secret Detection" >> $GITHUB_STEP_SUMMARY
          if [ -d artifacts/secrets-baseline ]; then
            echo "✅ Baseline available for comparison" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Run detect-secrets baseline setup required" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- [pip-audit results](artifacts/pip-audit-results)" >> $GITHUB_STEP_SUMMARY
          echo "- [secrets baseline](artifacts/secrets-baseline)" >> $GITHUB_STEP_SUMMARY
          echo "- [OWASP reports](artifacts/owasp-reports)" >> $GITHUB_STEP_SUMMARY

      - name: Enable GitHub Security Alerts
        run: |
          echo "✅ Security workflow completed"
          echo "Review alerts at: https://github.com/${{ github.repository }}/security/dependabot"

  # ─────────────────────────────────────────────────────────────────────────────
  # Gate: Fail if critical vulnerabilities found
  # ─────────────────────────────────────────────────────────────────────────────
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [dependency-scan]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Check vulnerability threshold
        run: |
          if [ -f artifacts/pip-audit-results/pip-audit-results.json ]; then
            CRITICAL_COUNT=$(python -c "
            import json, sys
            with open('artifacts/pip-audit-results/pip-audit-results.json') as f:
              data = json.load(f)
            vulns = data.get('vulnerabilities', [])
            critical = [v for v in vulns if any('CRITICAL' in str(s) or 'HIGH' in str(s) for s in v.get('vulns', []))]
            print(len(critical))
            ")

            if [ "$CRITICAL_COUNT" -gt 0 ]; then
              echo "❌ BLOCKED: Found $CRITICAL_COUNT critical/high vulnerabilities"
              echo "Please fix vulnerabilities before merging."
              exit 1
            fi
          fi
          echo "✅ Security gate passed - no critical vulnerabilities"